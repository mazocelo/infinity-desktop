appId: com.voxcity.infinity
productName: Infinity
directories:
  buildResources: resources
  output: release
asar: true
files:
  # Só a casca: as telas vêm do site (https://infinity.voxcity.com.br)
  - out/**/*
extraResources:
  # Tray icon — loaded at runtime via process.resourcesPath
  - from: resources/icon.png
    to: icon.png
protocols:
  - name: Infinity
    schemes:
      - infinity
win:
  target:
    - target: nsis
      arch:
        - x64
  # electron-builder auto-converts icon.png from buildResources to .ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Infinity
  artifactName: "Infinity-Setup.${ext}"
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.business
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
publish:
  provider: github
  owner: Voxcity-Dev
  repo: infinity-desktop
